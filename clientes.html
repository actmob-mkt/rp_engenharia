<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/base.css">
<script src="assets/js/dc-runtime.js"></script>
</head>
<body data-screen="Clientes">
<x-dc>
<helmet>
  <title>Clientes | RP Engenharia Industrial</title>
  <meta name="description" content="Empresas de saneamento, energia, automotiva, petroquímica, alimentícia e educacional que contam com a RP Engenharia.">
  <link rel="canonical" href="https://www.rpengenhariaindustrial.com.br/clientes">
  <meta property="og:type" content="website"><meta property="og:title" content="Clientes | RP Engenharia"><meta property="og:image" content="assets/img-exemplo/hero-home.webp"><meta property="og:locale" content="pt_BR">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="assets/data/site-data.js"></script>
  <script src="assets/data/solucoes.js"></script>
  <style>
    body{margin:0;background:#F4F4F1;color:#0A1033;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:#0B1B5C}a:hover{color:#C24E00}
    :focus-visible{outline:3px solid #FF7A1A;outline-offset:3px}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</helmet>
<dc-import name="Header" active="clientes" hint-size="100%,76px"></dc-import>
<main id="conteudo">
  <section aria-labelledby="h1" style="background:#060B26;color:#FFFFFF;">
    <div style="max-width:1440px;margin:0 auto;padding:clamp(48px,7vw,104px) clamp(28px,6vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:end;">
      <div style="display:flex;flex-direction:column;gap:20px;">
        <nav aria-label="Trilha" style="font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#8C93B3;"><a href="index.html" style="color:#8C93B3;">INÍCIO</a> / CLIENTES</nav>
        <h1 id="h1" style="font:800 clamp(38px,5.4vw,76px)/1.03 'Sora',sans-serif;letter-spacing:-.03em;margin:0;text-wrap:balance;">Quem já confiou a operação à RP.</h1>
      </div>
      <div style="display:flex;gap:16px;align-items:baseline;">
        <span style="font:800 clamp(64px,7vw,104px)/1 'Sora',sans-serif;letter-spacing:-.04em;color:#FF7A1A;">{{ total }}</span>
        <span style="font-size:17px;line-height:1.45;color:#C9CEE0;max-width:14em;">clientes atendidos em indústria, energia, saneamento e instituições</span>
      </div>
    </div>
  </section>
  <section aria-label="Logos de clientes" style="background:#FFFFFF;">
    <ul style="list-style:none;margin:0 auto;max-width:1440px;padding:clamp(40px,6vw,80px) clamp(28px,6vw,96px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:1px;background:#FFFFFF;">
      <sc-for list="{{ clientes }}" as="c" hint-placeholder-count="16">
        <li style="aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;padding:18px;outline:1px solid #E4E6EC;background:#FFFFFF;">
          <img src="{{ c.logo }}" alt="{{ c.nome }}" loading="lazy" style="max-width:100%;max-height:80px;filter:grayscale(1);opacity:.75;mix-blend-mode:multiply;transition:filter .3s,opacity .3s;" style-hover="filter:grayscale(0);opacity:1;"></img>
        </li>
      </sc-for>
    </ul>
  </section>
  <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));">
    <a href="orcamento.html" style="background:#FF7A1A;color:#0A1033;text-decoration:none;padding:clamp(48px,6vw,80px) clamp(28px,6vw,96px);display:flex;flex-direction:column;gap:10px;" style-hover="background:#FF8C3A;color:#0A1033;"><span style="font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;">PORTA 01</span><span style="font:800 clamp(28px,3.4vw,48px)/1.05 'Sora',sans-serif;">Quero ser cliente →</span></a>
    <a href="contato.html#fornecedor" style="background:#060B26;color:#FFFFFF;text-decoration:none;padding:clamp(48px,6vw,80px) clamp(28px,6vw,96px);display:flex;flex-direction:column;gap:10px;" style-hover="background:#0B1440;color:#FFFFFF;"><span style="font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#8C93B3;">PORTA 02</span><span style="font:800 clamp(28px,3.4vw,48px)/1.05 'Sora',sans-serif;">Quero ser fornecedor →</span></a>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!(window.RP_DATA && window.RP_CLIENTES) };
  componentDidMount() { const go = () => (window.RP_DATA && window.RP_CLIENTES) ? this.setState({ ready: true }) : (this.t = setTimeout(go, 40)); go(); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    if (!this.state.ready) return { clientes: [], total: '' };
    const n = window.RP_DATA.numeros.find(x => /clientes/.test(x.rotulo));
    return { clientes: window.RP_CLIENTES, total: n ? n.prefixo + n.valor : '' };
  }
}
</script>
<script src="assets/js/review-tool.js" data-project="RP Engenharia" data-html2canvas="assets/js/vendor/html2canvas.min.js" data-jspdf="assets/js/vendor/jspdf.umd.min.js" defer></script>
</body>
</html>
