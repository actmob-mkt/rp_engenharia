<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/base.css">
<script src="assets/js/dc-runtime.js"></script>
</head>
<body data-screen="Blog">
<x-dc>
<helmet>
  <title>Blog RP | Engenharia industrial na prática</title>
  <meta name="description" content="Artigos técnicos e registros de campo da RP Engenharia: elétrica, civil, instrumentação, segurança do trabalho e treinamentos.">
  <link rel="canonical" href="https://www.rpengenhariaindustrial.com.br/blog">
  <meta property="og:type" content="website"><meta property="og:title" content="Blog RP"><meta property="og:image" content="assets/img-exemplo/blog.webp"><meta property="og:locale" content="pt_BR">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="assets/data/site-data.js"></script>
  <style>
    body{margin:0;background:#F4F4F1;color:#0A1033;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:#0B1B5C}a:hover{color:#C24E00}
    :focus-visible{outline:3px solid #FF7A1A;outline-offset:3px}
    .blog-sub{white-space:nowrap}
    @media (max-width:760px){.blog-sub{white-space:normal}}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</helmet>
<dc-import name="Header" active="blog" hint-size="100%,76px"></dc-import>
<main id="conteudo">
  <section aria-labelledby="h1" style="background:#060B26;color:#FFFFFF;">
    <div style="max-width:1440px;margin:0 auto;padding:clamp(48px,7vw,104px) clamp(28px,6vw,96px);display:flex;flex-direction:column;gap:20px;">
      <nav aria-label="Trilha" style="font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#8C93B3;"><a href="index.html" style="color:#8C93B3;">INÍCIO</a> / BLOG RP</nav>
      <h1 id="h1" style="font:800 clamp(38px,5.4vw,76px)/1.03 'Sora',sans-serif;letter-spacing:-.03em;margin:0;">Do campo para o blog</h1>
      <p class="blog-sub" style="font-size:18px;line-height:1.6;color:#C9CEE0;margin:0;">Notas técnicas, bastidores de obra e registros de treinamentos das equipes RP.</p>
    </div>
  </section>
  <section aria-label="Publicações" style="max-width:1440px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(28px,6vw,96px);">
    <div style="display:flex;flex-direction:column;border-top:1px solid #0A1033;">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="3">
        <article style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 48px;padding:36px 0;border-bottom:1px solid #C9CCD8;align-items:center;">
          <div style="background:#0B1B5C;aspect-ratio:16/10;overflow:hidden;"><img src="{{ p.foto }}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15);mix-blend-mode:luminosity;opacity:.92;"></img></div>
          <div style="display:flex;flex-direction:column;gap:14px;">
            <span style="font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#C24E00;">{{ p.categoria }} · {{ p.data }}</span>
            <h2 style="font:700 clamp(24px,2.6vw,36px)/1.15 'Sora',sans-serif;margin:0;text-wrap:balance;">{{ p.titulo }}</h2>
            <p style="font-size:17px;line-height:1.6;color:#3A4266;margin:0;">{{ p.resumo }}</p>
            <a href="{{ p.href }}" style="font-weight:600;font-size:15px;">Ler post →</a>
          </div>
        </article>
      </sc-for>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!window.RP_DATA };
  componentDidMount() { const go = () => window.RP_DATA ? this.setState({ ready: true }) : (this.t = setTimeout(go, 40)); go(); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() { return { posts: this.state.ready ? window.RP_DATA.posts.map(p => Object.assign({}, p, { categoria: p.categoria.toUpperCase(), data: p.data.toUpperCase(), href: p.pagina || ('blog-termografia-em-paineis.html?p=' + p.slug) })) : [] }; }
}
</script>
</body>
</html>
